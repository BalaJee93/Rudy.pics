<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Rudy.pics</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <h1>Rudy<span>.pics</span></h1>
    <p>Little moments, big smiles.</p>
  </header>

  <main>
    <div id="gallery" class="gallery"></div>
    <p id="empty" class="empty" hidden>Photos coming soon! 📷</p>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous">&#8249;</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next">&#8250;</button>
  </div>

  <footer>Made with love for Rudy 💛</footer>

  <script src="photos.js"></script>
  <script src="script.js"></script>
</body>
</html>
